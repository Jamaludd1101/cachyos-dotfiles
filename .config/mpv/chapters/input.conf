# ==========    BASIC CONTROLS    ==========
SPACE       cycle pause
ENTER       cycle fullscreen
.           frame-step
,           frame-back-step
ESC         set fullscreen no

# ==========    PLAYLIST    ==========
f11         playlist-prev
f12         playlist-next

# ==========    VOLUME    ==========
UP          add volume 5
DOWN        add volume -5
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
+           add volume 10
-           add volume -10
m           cycle mute

# ==========    SEEKING    ==========
LEFT        seek -5
RIGHT       seek 5
Shift+LEFT  seek -60
Shift+RIGHT seek 60

# ==========    PROFILE SWITCHING    ==========
Ctrl+1      apply-profile anime-upscale; show-text "Profile: Anime HD (Anime4K)" 1500
Ctrl+2      apply-profile anime-lite; show-text "Profile: Anime Lite (FSRCNNX)" 1500
Ctrl+3      apply-profile film-real; show-text "Profile: Film HD (Ravu)" 1500
Ctrl+4      apply-profile default; show-text "Profile: Default" 1500
Ctrl+0      apply-profile reset-effects; show-text "Profile: Reset Effects" 1500

# ==========    FILE OPERATIONS    ==========
Alt+o       script-binding uosc/open-directory

# ==========    AUDIO    ==========
a           cycle audio
Shift+a     cycle audio down
x           add audio-delay -0.05
X           add audio-delay +0.05

# ==========    SUBTITLES    ==========
s           cycle sub
Shift+s     cycle sub down
z           add sub-delay -0.1
Z           add sub-delay +0.1
u           add sub-scale +0.1
U           add sub-scale -0.1

# ==========    SPEED CONTROL    ==========
[           multiply speed 0.9
]           multiply speed 1.1
{           set speed 1.0
}           set speed 2.0

# ==========    SCREENSHOT    ==========
Alt+s       screenshot video
Ctrl+s      screenshot window

# ==========    WINDOW    ==========
W           cycle ontop
Alt+F       cycle fullscreen
