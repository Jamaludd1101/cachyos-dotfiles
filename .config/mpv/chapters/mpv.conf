# ==========    SYSTEM & PERFORMANCE    ==========
profile=high-quality
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
dither-depth=auto
video-sync=display-resample
interpolation=no
tscale=oversample

# ==========    WINDOW & PLAYBACK    ==========
autofit=85%x85%
keep-open=yes
save-position-on-quit=yes
watch-later-directory="~~/watch_later"
cursor-autohide=500
border=no
osd-bar=no
osc=no
hr-seek=yes
hr-seek-framedrop=no

# ==========    VIDEO ENHANCEMENT BASE    ==========
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
linear-downscaling=yes
correct-downscaling=yes
sigmoid-upscaling=yes
sigmoid-center=0.75
sigmoid-slope=8.0
scale-antiring=0.7
dscale-antiring=0.7
cscale-antiring=0.7

# ==========    DEBANDING DEFAULT    ==========
deband=no
deband-iterations=2
deband-threshold=48
deband-range=24
deband-grain=6

# ==========    OSD SETTINGS    ==========
osd-level=1
osd-duration=2000
osd-font='Netflix Sans Medium'
osd-font-size=28
osd-color='#FFFFFFFF'
osd-border-color='#AA000000'
osd-border-size=2.5
osd-blur=0.4
osd-align-x=center
osd-align-y=top
osd-margin-x=40
osd-margin-y=40

# ==========    AUDIO    ==========
volume=80
volume-max=150
audio-file-auto=fuzzy
audio-pitch-correction=yes
audio-channels=auto
audio-normalize-downmix=yes

# Language priority
alang=ja,jp,jpn,eng,en,id
slang=eng,en,id,ja,jp,jpn

# ==========    SUBTITLES    ==========
sub-auto=fuzzy
sub-file-paths-append=subs
sub-file-paths-append=subtitles
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no
embeddedfonts=yes
sub-ass-override=scale
blend-subtitles=yes

# Subtitle styling (untuk subtitle SRT / non-ASS)
sub-font='Netflix Sans Medium'
sub-font-size=42
sub-color='#FFFFFFFF'
sub-border-color='#40000000'
sub-border-size=3.0
sub-shadow-color='#80000000'
sub-shadow-offset=1.5
sub-spacing=0.5
sub-margin-x=40
sub-margin-y=60

# ==========    SCREENSHOT    ==========
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=6
screenshot-tag-colorspace=yes
screenshot-directory="~/Pictures/mpv-shots"
screenshot-template="%F-%wH.%wM.%wS.%wT-#%#00n"

# ==========    CACHE    ==========
cache=yes
cache-pause=no
demuxer-max-bytes=100M
demuxer-max-back-bytes=20M

# ==========    SHADER MANAGEMENT    ==========
glsl-shaders=""
gpu-shader-cache-dir='~~/shaders/cache'

# ==========    PROFILES ==========

[anime-upscale]
profile-desc="Anime upscale HQ (Anime4K Stack)"
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes

deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=6

glsl-shaders-clr
glsl-shaders-append=~~/shaders/Anime4K_Clamp_Highlights.glsl
glsl-shaders-append=~~/shaders/Anime4K_Restore_CNN_M.glsl
glsl-shaders-append=~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl
glsl-shaders-append=~~/shaders/adaptive-sharpen.glsl

contrast=0.05
saturation=1.05
gamma=1.00

[anime-lite]
profile-desc="Anime ringan (FSRCNNX)"
scale=ewa_lanczos
deband=yes
deband-threshold=25

glsl-shaders-clr
glsl-shaders-append=~~/shaders/FSRCNNX_x2_8-0-4-1.glsl
glsl-shaders-append=~~/shaders/unsharp.glsl

[film-real]
profile-desc="Film realistis (Cinematic)"
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell

deband=yes
deband-threshold=20
deband-grain=4

glsl-shaders-clr
glsl-shaders-append=~~/shaders/ravu-r3.hook
glsl-shaders-append=~~/shaders/KrigBilateral.glsl
glsl-shaders-append=~~/shaders/adaptive-sharpen.glsl

contrast=0.03
saturation=1.02

[default]
profile-desc="Video biasa / YouTube"
scale=spline36
deband=yes
deband-threshold=15

glsl-shaders-clr
glsl-shaders-append=~~/shaders/unsharp.glsl

[reset-effects]
profile-desc=Reset All Effects
glsl-shaders=""
deband=no
